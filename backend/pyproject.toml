[project]
name = "draft-copilot-backend"
version = "0.1.0"
description = "ESPN nine-category fantasy basketball draft copilot backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143,<0.144",
    "uvicorn[standard]>=0.54,<0.55",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.15,<3",
    "numpy>=2.5,<3",
    "pandas>=3.0,<4",
    "scipy>=1.18,<2",
    "pyarrow>=26,<27",
    "httpx>=0.28,<0.29",
    "nba_api>=1.11.4,<2",
    "espn_api>=1.0.1,<2",
    "python-multipart>=0.0.20",
    "orjson>=3.10",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-cov>=7",
    "hypothesis>=6.168",
    "ruff>=0.17",
    "mypy>=1.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["N812"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"app/api/routes.py" = ["B008", "E501"]
"app/bench.py" = ["E501"]
"app/recommend/*" = ["E501"]
"app/projections/*" = ["E501"]
"app/api/schemas.py" = ["E501"]
"app/cli.py" = ["E501"]
"app/imports/*" = ["E501"]
"app/eval/*" = ["E501", "N806"]
"app/projections/learned.py" = ["N803", "N806"]
"app/projections/research.py" = ["N806"]
